# pyproject.toml
# SPDX-License-Identifier: CC0-1.0
# This file was created by an AI model: openai/gpt-6.1-sol

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coaxi"]

[project]
name = "coaxi"
version = "1.3.0"
description = "AXI interface helpers for cocotb testbenches."
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
license-files = ["LICENSE.txt"]
dependencies = [
	"cocotb>=2.1.0",
]

[dependency-groups]
dev = [
	"coverage>=7.6",
	"pytest",
	"pyrefly",
	"ruff",
]
docs = [
	"sphinx",
	"myst-parser",
	"furo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["coaxi"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["I001", "BLE001"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = false
length-sort = true
no-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
