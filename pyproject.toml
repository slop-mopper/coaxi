# pyproject.toml
# SPDX-License-Identifier: CC0-1.0
# This file was created by an AI model: openai/gpt-6.1-sol

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coaxi"]

[project]
name = "coaxi"
version = "0.1.0"
description = "AXI interface helpers for cocotb testbenches."
requires-python = ">=3.13"
license = "CC0-1.0"
dependencies = [
	"cocotb>=2.1.0",
]

[dependency-groups]
dev = [
	"pytest",
	"pyrefly",
	"ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["I001", "BLE001"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = false
length-sort = true
no-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
